
name: Build Calculator APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project dependencies
        run: npm install

      - name: Install matching Capacitor Media plugin and bundler
        shell: bash
        run: |
          CAP_MAJOR=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          if [ "$CAP_MAJOR" = "8" ]; then
            npm install @capacitor-community/media@^9
          elif [ "$CAP_MAJOR" = "7" ]; then
            npm install @capacitor-community/media@^8
          elif [ "$CAP_MAJOR" = "6" ]; then
            npm install @capacitor-community/media@^7
          else
            echo "Unsupported Capacitor major version: $CAP_MAJOR"
            exit 1
          fi
          npm install --save-dev esbuild

      - name: Bundle native Gallery bridge
        run: npx esbuild native-gallery.js --bundle --format=esm --outfile=www/native-gallery.bundle.js

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android plugins
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
